# Local development services only; credentials and exposed ports are not deployment defaults.
name: axiapay-development
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: axiapay
      POSTGRES_PASSWORD: axiapay_local_only
      POSTGRES_DB: axiapay
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis-cache:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    ports: ["127.0.0.1:56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis-jobs:
    image: redis:8-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports: ["127.0.0.1:56380:6379"]
    volumes: ["redis-jobs-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  mailpit:
    image: axllent/mailpit:v1.31.5
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
    ports: ["127.0.0.1:51025:1025", "127.0.0.1:58025:8025"]
    volumes: ["mailpit-data:/data"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  postgres-data:
  redis-jobs-data:
  mailpit-data:
